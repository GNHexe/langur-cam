<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Langur Cam</title>
<meta name="theme-color" content="#0b0b0b">
<style>
  :root{--bg:#0b0b0b;--fg:#f4efe6;--dim:#8a847a;--accent:#ff8a1a;--rec:#ff2e2e;--panel:rgba(16,16,16,.92)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas#cv{max-width:100%;max-height:100%;aspect-ratio:9/16;background:#000}
  #status{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
  .pill{background:var(--panel);padding:6px 10px;border-radius:999px;font-size:12px;letter-spacing:.02em}
  #timer{color:var(--rec);font-variant-numeric:tabular-nums}
  #lost{color:var(--accent)}
  #panel{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.85) 30%)}
  .row{display:flex;align-items:center;gap:10px;margin:4px 0}
  .row label{width:58px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .row output{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
  input[type=range]{flex:1;accent-color:var(--accent);height:28px}
  .toggles{display:flex;gap:6px;margin:8px 0 12px}
  .tog{flex:1;min-width:0;border:1px solid #333;background:#151515;color:var(--fg);padding:9px 4px;border-radius:10px;font-size:12px;white-space:nowrap}
  .tog[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
  #recbtn{display:block;margin:0 auto;width:72px;height:72px;border-radius:50%;border:4px solid var(--fg);background:transparent;position:relative}
  #recbtn::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--rec);transition:all .2s}
  #recbtn.on::after{inset:20px;border-radius:6px}
  #gate,#review{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  #gate img{width:180px;height:180px}
  #gate h1{font-size:24px;letter-spacing:.04em}
  #gate p{color:var(--dim);max-width:300px}
  .btn{background:var(--accent);color:#111;border:0;padding:14px 26px;border-radius:12px;font-weight:700;font-size:16px}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid #444}
  #review video{max-height:62vh;max-width:100%;border-radius:12px;background:#000}
  #review .acts{display:flex;gap:10px}
  #err{color:var(--rec);font-size:13px;max-width:320px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="720" height="1280"></canvas></div>
<div id="status"><span class="pill" id="info">loading…</span><span class="pill" id="lost" hidden>no face, holding</span><span class="pill" id="timer" hidden>● 0:00</span></div>

<div id="panel">
  <div class="row"><label>Voice</label><input id="pitch" type="range" min="-12" max="12" step="1" value="-5"><output id="pitchV">-5</output></div>
  <div class="row"><label>Mouth</label><input id="sens" type="range" min="0.5" max="2.5" step="0.1" value="1.2"><output id="sensV">1.2</output></div>
  <div class="row"><label>Size</label><input id="size" type="range" min="1.6" max="3.4" step="0.05" value="2.5"><output id="sizeV">2.50</output></div>
  <div class="toggles">
    <button class="tog" id="tBg" aria-pressed="false">Green screen</button>
    <button class="tog" id="tHands" aria-pressed="true">Hands</button>
    <button class="tog" id="tMon" aria-pressed="false">Hear 🎧</button>
    <button class="tog" id="tDbg" aria-pressed="false">Debug</button>
  </div>
  <button id="recbtn" aria-label="Record"></button>
</div>

<div id="review" hidden>
  <video id="clip" playsinline controls></video>
  <div class="acts"><button class="btn" id="save">Save / Share</button><button class="btn ghost" id="again">Retake</button></div>
</div>

<div id="gate">
  <img id="gateImg" alt="">
  <h1>LANGUR CAM</h1>
  <p id="gateMsg">Front camera + mic. The langur takes your face, the slider takes your voice.</p>
  <button class="btn" id="go">Start</button>
  <div id="err"></div>
</div>

<video id="cam" playsinline muted style="display:none"></video>

    micSrc = tctx.createMediaStreamSource(new MediaStream(mediaStream.getAudioTracks()));
    if (!pitchFx) {
      pitchFx = new Tone.PitchShift({ pitch: +pitchEl.value, windowSize: 0.08 });
      recDest = tctx.createMediaStreamDestination();
      analyser = tctx.createAnalyser(); analyser.fftSize = 1024;
      abuf = new Float32Array(analyser.fftSize);
    }
    Tone.connect(micSrc, pitchFx);
    Tone.connect(micSrc, analyser);
    routeVoice();

    if (!landmarker) {
      $('go').textContent = 'Loading face tracker…';
      fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      // low confidence floors so it keeps finding you further from the camera
      const opts = d => ({ baseOptions: { modelAssetPath: FACE_MODEL, delegate: d }, runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true,
        minFaceDetectionConfidence: 0.3, minFacePresenceConfidence: 0.3, minTrackingConfidence: 0.3 });
      try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
      catch { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU")); }
    }
    if (handsOn) ensureHands();
    if (greenOn) ensureSegmenter();

    $('gate').hidden = true;
    $('info').textContent = 'ready';
    running = true;
    cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    stopMedia();
    $('err').textContent = (e && e.name === 'NotAllowedError') ? 'Camera or mic is blocked. Allow both for this site in Safari settings, then reload.' : 'Could not start: ' + (e.message || e);
  } finally {
    $('go').disabled = false; $('go').textContent = running ? 'Start' : 'Try again';
  }
}

// Release camera + mic whenever the page goes to the background, so the mic light turns off.
function stopMedia() {
  running = false;
  cancelAnimationFrame(rafId);
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  mediaStream = null; cam.srcObject = null;
  if (micSrc) { try { micSrc.disconnect(); } catch {} micSrc = null; }
  try { Tone.getContext().rawContext.suspend(); } catch {}
}
function pause() {
  if (!running) return;
  stopMedia();
  $('gateMsg').textContent = 'Paused. Camera and mic are off.';
  $('go').textContent = 'Resume';
  $('gate').hidden = false;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('pagehide', pause);

async function loadTask(Task, model, extra, label) {
  $('info').textContent = 'loading ' + label + '…';
  const opts = d => ({ baseOptions: { modelAssetPath: model, delegate: d }, runningMode: "VIDEO", ...extra });
  let t = null;
  try { t = await Task.createFromOptions(fileset, opts("GPU")); }
  catch { try { t = await Task.createFromOptions(fileset, opts("CPU")); } catch (e) { console.error(e); } }
  $('info').textContent = t ? 'ready' : label + ' failed';
  return t;
}
async function ensureSegmenter() {
  if (segmenter || segLoading || !fileset) return;
  segLoading = true;
  segmenter = await loadTask(ImageSegmenter, SEG_MODEL, { outputCategoryMask: false, outputConfidenceMasks: true }, 'cutout');
  segLoading = false;
}
async function ensureHands() {
  if (handTracker || handLoading || !fileset) return;
  handLoading = true;
  handTracker = await loadTask(HandLandmarker, HAND_MODEL, { numHands: 2, minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4, minTrackingConfidence: 0.4 }, 'hands');
  handLoading = false;
}

// ---------- geometry ----------
function coverRect(vw, vh) {
  const s = Math.max(CW / vw, CH / vh);
  const sw = CW / s, sh = CH / s;
  return { sx: (vw - sw) / 2, sy: (vh - sh) / 2, sw, sh, s };
}
function toCanvas(p, vw, vh, r) {
  const x = (p.x * vw - r.sx) * r.s, y = (p.y * vh - r.sy) * r.s;
  return { x: CW - x, y, z: p.z * vw * r.s };
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = v => Math.max(0, Math.min(1, v));
const bs = (cats, name) => { const c = cats.find(c => c.categoryName === name); return c ? c.score : 0; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);

function drawMirrored(c, src, r) {
  c.save(); c.translate(CW, 0); c.scale(-1, 1);
  c.drawImage(src, r.sx, r.sy, r.sw, r.sh, 0, 0, CW, CH);
  c.restore();
}
function applyPersonMask(c, r, vw) {
  const k = maskCv.width / vw;
  c.globalCompositeOperation = 'destination-in';
  c.save(); c.translate(CW, 0); c.scale(-1, 1);
  c.drawImage(maskCv, r.sx * k, r.sy * k, r.sw * k, r.sh * k, 0, 0, CW, CH);
  c.restore();
  c.globalCompositeOperation = 'source-over';
}

// background: camera, or you cut out over green
function drawBackground(r, vw, vh, ts) {
  if (!greenOn) { drawMirrored(ctx, cam, r); return; }
  ctx.fillStyle = '#00b140'; ctx.fillRect(0, 0, CW, CH);
  if (!segmenter) return;
  segmenter.segmentForVideo(cam, ts, res => {
    const m = res.confidenceMasks && res.confidenceMasks[0];
    if (!m) return;
    const w = m.width, h = m.height, f = m.getAsFloat32Array();
    if (maskCv.width !== w || maskCv.height !== h) { maskCv.width = w; maskCv.height = h; maskImg = maskCtx.createImageData(w, h); }
    const d = maskImg.data;
    for (let i = 0; i < f.length; i++) {
      d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = 255; d[i * 4 + 3] = clamp01((f[i] - 0.35) / 0.3) * 255;
    }
    maskCtx.putImageData(maskImg, 0, 0);
  });
  if (!maskImg) return;
  personCtx.clearRect(0, 0, CW, CH);
  drawMirrored(personCtx, cam, r);
  applyPersonMask(personCtx, r, vw);
  ctx.drawImage(personCv, 0, 0);
}

// hands: cut your real hands out of the camera frame and lay them over the langur
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
const PALM = [0, 1, 5, 9, 13, 17];
function drawHands(r, vw) {
  if (!hands.length) return;
  const m = handMaskCtx;
  m.clearRect(0, 0, CW, CH);
  m.fillStyle = m.strokeStyle = '#fff';
  m.lineCap = m.lineJoin = 'round';
  for (const h of hands) {
    const palmW = dist(h[5], h[17]);
    m.lineWidth = palmW * 0.32;
    m.beginPath();
    PALM.forEach((i, n) => n ? m.lineTo(h[i].x, h[i].y) : m.moveTo(h[i].x, h[i].y));
    m.closePath(); m.fill(); m.stroke();
    m.beginPath();
    for (const [a, b] of BONES) { m.moveTo(h[a].x, h[a].y); m.lineTo(h[b].x, h[b].y); }
    m.stroke();
    const w = h[0], c = h[9], dx = w.x - c.x, dy = w.y - c.y;
    m.lineWidth = palmW * 0.8;
    m.beginPath(); m.moveTo(w.x, w.y); m.lineTo(w.x + dx * 0.6, w.y + dy * 0.6); m.stroke();
  }
  // camera first, then keep only the hand shapes. Safari ignores composite modes when the source is a video,
  // so the video is always drawn plain and the masking is done with a canvas.
  handCtx.globalCompositeOperation = 'source-over';
  handCtx.clearRect(0, 0, CW, CH);
  drawMirrored(handCtx, cam, r);
  handCtx.globalCompositeOperation = 'destination-in';
  handCtx.drawImage(handMaskCv, 0, 0);
  handCtx.globalCompositeOperation = 'source-over';
  if (greenOn && maskImg) applyPersonMask(handCtx, r, vw);
  ctx.drawImage(handCv, 0, 0);
}

// voice loudness above the room's noise floor, 0..1
function voiceLevel() {
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(abuf);
  let s = 0; for (let i = 0; i < abuf.length; i++) s += abuf[i] * abuf[i];
  const db = 10 * Math.log10(s / abuf.length + 1e-12);
  noiseDb = db < noiseDb ? lerp(noiseDb, db, 0.3) : lerp(noiseDb, db, 0.002);
  return clamp01((db - (noiseDb + 10)) / 22);
}

// ---------- main loop ----------
let lastT = -1, frameNo = 0;
function loop(now) {
  if (!running) return;
  rafId = requestAnimationFrame(loop);
  const vw = cam.videoWidth, vh = cam.videoHeight;
  if (!vw) return;
  const r = coverRect(vw, vh);
  const fresh = cam.currentTime !== lastT; lastT = cam.currentTime;
  const ts = performance.now();

  drawBackground(r, vw, vh, ts);
  const voice = voiceLevel();

  if (fresh && handsOn && handTracker) {
    const hr = handTracker.detectForVideo(cam, ts);
    hands = (hr.landmarks || []).map(L => L.map(p => toCanvas(p, vw, vh, r)));
    if (hands.length) lastHandAt = now;
  }

  const res = fresh ? landmarker.detectForVideo(cam, ts) : null;
  if (res && res.faceLandmarks && res.faceLandmarks.length) {
    const L = res.faceLandmarks[0];
    const P = i => toCanvas(L[i], vw, vh, r);
    const top = P(10), chin = P(152), lc = P(234), rc = P(454), nose = P(1), le = P(33), re = P(263);
    const faceW = dist3(lc, rc);          // 3D width: doesn't shrink when you turn your head
    const faceH = dist3(top, chin);
    const cx = (top.x + chin.x) / 2, cy = (top.y + chin.y) / 2;
    let roll = Math.atan2(re.y - le.y, re.x - le.x);
    if (roll > Math.PI / 2) roll -= Math.PI; else if (roll < -Math.PI / 2) roll += Math.PI;
    const yaw = Math.max(-1, Math.min(1, (nose.x - (lc.x + rc.x) / 2) / (dist(lc, rc) / 2 + 1)));
    const cats = res.faceBlendshapes?.[0]?.categories || [];
    const jaw = bs(cats, 'jawOpen');
    const smile = Math.max(bs(cats, 'mouthSmileLeft'), bs(cats, 'mouthSmileRight')) * 0.6 + (bs(cats, 'mouthSmileLeft') + bs(cats, 'mouthSmileRight')) / 2 * 0.4;
    const blink = (bs(cats, 'eyeBlinkLeft') + bs(cats, 'eyeBlinkRight')) / 2;
    const brow = bs(cats, 'browInnerUp');
    const lip = dist(P(13), P(14)) / faceH;

    const target = { cx, cy, faceW, roll, yaw, brow };
    if (!pose) pose = target;
    else for (const k in target) pose[k] = lerp(pose[k], target[k], k === 'brow' ? 0.35 : 0.55);

    // mouth: lip gap + mouth blendshapes; voice only counts while your mouth is actually moving,
    // so other people talking or music doesn't flap the langur
    const sens = +sensEl.value;
    const lower = (bs(cats, 'mouthLowerDownLeft') + bs(cats, 'mouthLowerDownRight')) / 2;
    const upper = (bs(cats, 'mouthUpperUpLeft') + bs(cats, 'mouthUpperUpRight')) / 2;
    const lipScore = clamp01((lip - 0.006) / 0.05);
    const shapeScore = clamp01(Math.max(jaw / 0.3, lower / 0.35, upper / 0.45));
    const open = Math.max(lipScore, shapeScore);
    motion = lerp(motion, Math.abs(open - prevOpen), 0.3); prevOpen = open;
    if (open > 0.08 || motion > 0.015) lipActiveUntil = now + 600;
    const voiceUsed = now < lipActiveUntil ? voice * 0.85 : 0;
    const raw = Math.max(open, voiceUsed) * sens;
    level = raw > level ? lerp(level, raw, 0.7) : lerp(level, raw, 0.45);
    const smiling = smile > (mouth === 'grin' ? 0.28 : 0.38);
    // shout only on a real jaw drop from your face, never from voice or normal talking
    const bigOpen = jaw > (mouth === 'wide' ? 0.38 : 0.5) || (jaw > 0.3 && lipScore > 0.85);
    if (bigOpen) mouth = 'wide';
    // talking range: closed -> small -> talk
    else if (level > (mouth === 'talk' ? 0.36 : 0.46)) mouth = 'talk';
    else if (smiling) mouth = 'grin';
    else if (level > (mouth === 'small' ? 0.1 : 0.16)) mouth = 'small';
    else mouth = 'closed';

    // blink: a real blink is a fast spike above your resting level that's over in well under half a second.
    // Slow rises (looking down at the phone, squinting) are ignored.
    if (blinkBase === null) blinkBase = blink;
    if (!blinkOn) blinkBase = lerp(blinkBase, blink, blink < blinkBase + 0.08 ? 0.04 : 0.004);
    blinkHist.push([now, blink]); while (blinkHist.length && now - blinkHist[0][0] > 220) blinkHist.shift();
    const recentMin = Math.min(...blinkHist.map(b => b[1]));
    const span = Math.max(0.2, 1 - blinkBase);
    if (blinkOn) {
      if (blink < blinkBase + span * 0.25 || now - blinkStart > 380) { blinkOn = false; blinkLock = now - blinkStart > 380; }
    } else if (blinkLock) {
      if (blink < blinkBase + span * 0.2) blinkLock = false;      // wait until eyes reopen before allowing another
    } else if (blink > blinkBase + span * 0.4 && blink - recentMin > span * 0.3) {
      blinkOn = true; blinkStart = now;
    }

    lastSeen = now;
    lastDbg = { lip: lipScore, shape: shapeScore, motion: clamp01(motion * 10), voice: voiceUsed, mouthLvl: clamp01(level), smile, blink, eyeBase: blinkBase, yaw: Math.abs(yaw) };
  }

  // duck-out: face gone AND a hand is up near where the face was = you're holding something in front of it
  const faceGone = pose && now - lastSeen > 250;
  let handNearFace = false;
  if (pose && now - lastHandAt < 500) {
    for (const h of hands) { const c = h[9]; if (Math.hypot(c.x - pose.cx, c.y - pose.cy) < pose.faceW * 1.6) handNearFace = true; }
  }
  const duck = faceGone && handNearFace;
  langurAlpha = lerp(langurAlpha, duck ? 0 : 1, duck ? 0.35 : 0.5);
  $('lost').hidden = !faceGone;
  $('lost').textContent = duck ? 'langur ducked' : 'no face, holding';

  // langur
  if (pose && langurAlpha > 0.02) {
    const ay = Math.abs(pose.yaw);
    const size = pose.faceW * +sizeEl.value * (1 + ay * 0.12);
    const hop = Math.max(0, pose.brow - 0.25) * pose.faceW * 0.12;
    ctx.save();
    ctx.globalAlpha = langurAlpha;
    // when you turn, slide the langur toward the back of your head instead of squashing it
    ctx.translate(pose.cx - pose.yaw * pose.faceW * 0.28, pose.cy - hop);
    ctx.rotate(pose.roll);
    const x = -size / 2, y = -size * PATCH_CY;
    ctx.drawImage(layers.base, x, y, size, size);
    if (mouth !== 'closed') ctx.drawImage(layers['mouth_' + mouth], x, y, size, size);
    if (blinkOn) ctx.drawImage(layers.blink, x, y, size, size);
    ctx.restore();
  }

  if (handsOn) drawHands(r, vw);
  if (debugOn && lastDbg) drawDebug(lastDbg);

  if (recorder) {
    const s = Math.floor((Date.now() - recStart) / 1000);
    $('timer').textContent = `● ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }
}

function drawDebug(v) {
  const rows = Object.entries(v);
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(16, 110, 330, 40 + rows.length * 30);
  ctx.font = '600 24px system-ui'; let y = 145;
  for (const [k, val] of rows) {
    ctx.fillStyle = '#fff'; ctx.fillText(k, 28, y);
    ctx.fillStyle = '#ff8a1a'; ctx.fillRect(150, y - 18, clamp01(val) * 130, 16);
    ctx.fillStyle = '#fff'; ctx.fillText(val.toFixed(2), 286, y); y += 30;
  }
  ctx.fillText(`mouth: ${mouth}${blinkOn ? ' · blink' : ''} · hands ${hands.length}`, 28, y); ctx.restore();
}

// ---------- recording ----------
function pickMime() {
  const c = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return c.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
}
$('recbtn').onclick = () => {
  if (recorder) { recorder.stop(); return; }
  if (!running) return;
  const vs = cv.captureStream(30);
  const stream = new MediaStream([...vs.getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  lastMime = pickMime();
  recorder = new MediaRecorder(stream, lastMime ? { mimeType: lastMime, videoBitsPerSecond: 6e6 } : undefined);
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    lastBlob = new Blob(chunks, { type: recorder.mimeType || lastMime || 'video/webm' });
    vs.getTracks().forEach(t => t.stop());
    recorder = null; $('recbtn').classList.remove('on'); $('timer').hidden = true;
    if (!lastBlob.size) return;
    $('clip').src = URL.createObjectURL(lastBlob); $('review').hidden = false;
  };
  recorder.start(250); recStart = Date.now();
  $('recbtn').classList.add('on'); $('timer').hidden = false;
};
$('again').onclick = () => { $('review').hidden = true; $('clip').pause(); };
$('save').onclick = async () => {
  if (!lastBlob) return;
  const ext = lastBlob.type.includes('mp4') ? 'mp4' : 'webm';
  const file = new File([lastBlob], `langur-${Date.now()}.${ext}`, { type: lastBlob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
};
$('info').textContent = 'tap Start';
</script>
</body>
</html>
